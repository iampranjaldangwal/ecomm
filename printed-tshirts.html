<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Printed T-Shirts - Trendy Wear</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
  <header>
    <div id="navbar-container"></div>
  </header>

  <section id="products">
    <h2>Men's Printed T-Shirts</h2>
    <div class="product-container">

      <div class="mufti-product">
        <a href="product-detail.html">
          <div class="product-image">
            <img src="images/printedTee/printed3.jpg" alt="Graphic Print Tee">
            <div class="hover-icons">
              <i class="far fa-heart" aria-label="Add to Wishlist"></i>
              <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
            </div>
          </div>
        </a>
        <p class="product-title">Graphic Print Tee</p>
        <div class="price-section">
          <span class="discounted-price">₹700</span>
          <span class="original-price">₹1,200</span>
          <span class="discount-tag">40% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #444;"></span>
          <span class="color-swatch" style="background-color: #eee;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <a href="product-detail.html">
          <div class="product-image">
            <img src="images/printedTee/printed5.jpg" alt="Floral Printed Tee">
            <div class="hover-icons">
              <i class="far fa-heart" aria-label="Add to Wishlist"></i>
              <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
            </div>
          </div>
        </a>
        <p class="product-title">Floral Printed Tee</p>
        <div class="price-section">
          <span class="discounted-price">₹750</span>
          <span class="original-price">₹999</span>
          <span class="discount-tag">25% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #8b5e3c;"></span>
          <span class="color-swatch" style="background-color: #f5f5dc;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <a href="product-detail.html">
          <div class="product-image">
            <img src="images/printedTee/printed4.jpg" alt="Cartoon Printed Tee">
            <div class="hover-icons">
              <i class="far fa-heart" aria-label="Add to Wishlist"></i>
              <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
            </div>
          </div>
        </a>
        <p class="product-title">Cartoon Printed Tee</p>
        <div class="price-section">
          <span class="discounted-price">₹800</span>
          <span class="original-price">₹1,000</span>
          <span class="discount-tag">20% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #f0c929;"></span>
          <span class="color-swatch" style="background-color: #ffffff;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <a href="product-detail.html">
          <div class="product-image">
            <img src="images/printedTee/printedCarousel2.jpg" alt="Abstract Print Tee">
            <div class="hover-icons">
              <i class="far fa-heart" aria-label="Add to Wishlist"></i>
              <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
            </div>
          </div>
        </a>
        <p class="product-title">Abstract Print Tee</p>
        <div class="price-section">
          <span class="discounted-price">₹750</span>
          <span class="original-price">₹950</span>
          <span class="discount-tag">21% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #212121;"></span>
          <span class="color-swatch" style="background-color: #b0bec5;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <a href="product-detail.html">
          <div class="product-image">
            <img src="images/printedTee/printed5.jpg" alt="Minimal Printed Tee">
            <div class="hover-icons">
              <i class="far fa-heart" aria-label="Add to Wishlist"></i>
              <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
            </div>
          </div>
        </a>
        <p class="product-title">Minimal Printed Tee</p>
        <div class="price-section">
          <span class="discounted-price">₹750</span>
          <span class="original-price">₹900</span>
          <span class="discount-tag">17% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #3e2723;"></span>
          <span class="color-swatch" style="background-color: #efebe9;"></span>
        </div>
      </div>

    </div>
  </section>

  <div id="footer-container"></div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="script.js"></script>
  <script src="footer.js"></script>
  <script src="navbar.js"></script>
</body>
</html>
