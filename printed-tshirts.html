<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printed T-Shirts - Trendy Wear</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div id="navbar-container"></div>
    </header>

    <section id="products">
        <h2>Men's Printed T-Shirts</h2>
        <div class="product-container">
            <div class="product" data-id="1" data-name="Graphic Print Tee" data-price="700">
                <img src="images/Tshirt1.jpg" alt="Graphic Print Tee">
                <p>Graphic Print Tee - ₹700</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(1)">-</button>
                    <span id="qty-1">0</span>
                    <button onclick="addToCart(1, 'Graphic Print Tee', 700)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(1, 'Graphic Print Tee', 700)">Add to Cart</button>
            </div>
            <div class="product" data-id="2" data-name="Floral Printed Tee" data-price="750">
                <img src="images/Tshirt2.jpg" alt="Floral Printed Tee">
                <p>Floral Printed Tee - ₹750</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Floral Printed Tee', 750)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Floral Printed Tee', 750)">Add to Cart</button>
            </div>
            <div class="product" data-id="3" data-name="Cartoon Printed Tee" data-price="800">
                <img src="images/printedTee/printed3.jpg" alt="Cartoon Printed Tee">
                <p>Cartoon Printed Tee - ₹800</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(3)">-</button>
                    <span id="qty-3">0</span>
                    <button onclick="addToCart(3, 'Cartoon Printed Tee', 800)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(3, 'Cartoon Printed Tee', 800)">Add to Cart</button>
            </div>
            <div class="product" data-id="4" data-name="Floral Printed Tee" data-price="750">
                <img src="images/printedTee/printed4.jpg" alt="Floral Printed Tee">
                <p>Floral Printed Tee - ₹750</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Floral Printed Tee', 750)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Floral Printed Tee', 750)">Add to Cart</button>
            </div>

            <div class="product" data-id="5" data-name="Floral Printed Tee" data-price="750">
                <img src="images/printedTee/printed5.jpg" alt="Floral Printed Tee">
                <p>Floral Printed Tee - ₹750</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Floral Printed Tee', 750)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Floral Printed Tee', 750)">Add to Cart</button>
            </div>
        </div>
    </section>

    <section id="cart">
        <h2>Shopping Cart</h2>
        <div id="cart-items"></div>
        <p>Total: ₹<span id="cart-total">0</span></p>
        <button onclick="checkout()">Checkout</button>
    </section>

    <script src="script.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
</body>
</html>
