<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Printed T-Shirts - Trendy Wear</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
  <header>
    <div id="navbar-container"></div>
  </header>

  <section id="products">
    <h2>Men's Printed T-Shirts</h2>
    <div class="product-container">

      <div class="mufti-product">
        <a href="product-detail.html">
          <div class="product-image">
            <img src="images/printedTee/printed3.jpg" alt="Graphic Print Tee">
            <div class="hover-icons">
              <i class="far fa-heart" aria-label="Add to Wishlist"></i>
              <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
            </div>
            <div class="product" data-id="2" data-name="Floral Printed Tee" data-price="750">
                <img src="images/Tshirt2.jpg" alt="Floral Printed Tee">
                <p>Floral Printed Tee - ₹750</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Floral Printed Tee', 750)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Floral Printed Tee', 750)">Add to Cart</button>
            </div>
            <div class="product" data-id="3" data-name="Cartoon Printed Tee" data-price="800">
                <img src="images/printedTee/printed3.jpg" alt="Cartoon Printed Tee">
                <p>Cartoon Printed Tee - ₹800</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(3)">-</button>
                    <span id="qty-3">0</span>
                    <button onclick="addToCart(3, 'Cartoon Printed Tee', 800)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(3, 'Cartoon Printed Tee', 800)">Add to Cart</button>
            </div>
            <div class="product" data-id="4" data-name="Floral Printed Tee" data-price="750">
                <img src="images/printedTee/printed4.jpg" alt="Floral Printed Tee">
                <p>Floral Printed Tee - ₹750</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Floral Printed Tee', 750)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Floral Printed Tee', 750)">Add to Cart</button>
            </div>

            <div class="product" data-id="5" data-name="Floral Printed Tee" data-price="750">
                <img src="images/printedTee/printed5.jpg" alt="Floral Printed Tee">
                <p>Floral Printed Tee - ₹750</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Floral Printed Tee', 750)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Floral Printed Tee', 750)">Add to Cart</button>
            </div>
          </div>
        </a>
        <p class="product-title">Minimal Printed Tee</p>
        <div class="price-section">
          <span class="discounted-price">₹750</span>
          <span class="original-price">₹900</span>
          <span class="discount-tag">17% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #3e2723;"></span>
          <span class="color-swatch" style="background-color: #efebe9;"></span>
        </div>
      </div>

    </div>
  </section>

  <div id="footer-container"></div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="script.js"></script>
  <script src="footer.js"></script>
  <script src="navbar.js"></script>
</body>
</html>
