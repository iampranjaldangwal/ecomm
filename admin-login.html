<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Admin Login</h3>
    <form id="loginForm">
      <input type="text" class="form-control mb-3" id="username" placeholder="Username" required>
      <input type="password" class="form-control mb-3" id="password" placeholder="Password" required>
      <button type="submit" class="btn btn-dark w-100">Login</button>
    </form>
    <div id="error" class="text-danger text-center mt-2" style="display:none;">Invalid credentials</div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "admin" && pass === "admin123") {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    });
  </script>
</body>
</html>
