<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurtis Collection - Trendy Wear</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="sizeSelector.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous">
</head>
<body>
    <header>
        <div id="navbar-container"></div>
    </header>

    <section id="products">
        <h2>Women's Kurtis</h2>
        <div class="product-container">
            <div class="mufti-product">
                <div class="product-image">
                    <img src="images/kurtis/kurti1.jpg" alt="Floral Kurti">
                    <div class="hover-icons">
                        <i class="far fa-heart" aria-label="Add to Wishlist"></i>
                        <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
                    </div>
                </div>
                <p class="product-title">Floral Kurti</p>
                <div class="price-section">
                    <span class="discounted-price">₹1,200</span>
                    <span class="original-price">₹1,500</span>
                    <span class="discount-tag">20% OFF</span>
                </div>
                <div class="color-swatches">
                    <span class="color-swatch" style="background-color: #f5e1e1;"></span>
                    <span class="color-swatch" style="background-color: #ffe5b4;"></span>
                </div>
            </div>

            <div class="mufti-product">
                <div class="product-image">
                    <img src="images/kurtis/kurti2.jpg" alt="Embroidered Kurti">
                    <div class="hover-icons">
                        <i class="far fa-heart" aria-label="Add to Wishlist"></i>
                        <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
                    </div>
                </div>
                <p class="product-title">Embroidered Kurti</p>
                <div class="price-section">
                    <span class="discounted-price">₹1,400</span>
                    <span class="original-price">₹1,800</span>
                    <span class="discount-tag">22% OFF</span>
                </div>
                <div class="color-swatches">
                    <span class="color-swatch" style="background-color: #c1a57b;"></span>
                    <span class="color-swatch" style="background-color: #e8d1ba;"></span>
                </div>
            </div>

            <div class="mufti-product">
                <div class="product-image">
                    <img src="images/kurtis/kurti3.jpg" alt="Cotton Kurti">
                    <div class="hover-icons">
                        <i class="far fa-heart" aria-label="Add to Wishlist"></i>
                        <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
                    </div>
                </div>
                <p class="product-title">Cotton Kurti</p>
                <div class="price-section">
                    <span class="discounted-price">₹1,000</span>
                    <span class="original-price">₹1,300</span>
                    <span class="discount-tag">23% OFF</span>
                </div>
                <div class="color-swatches">
                    <span class="color-swatch" style="background-color: #e2e2e2;"></span>
                    <span class="color-swatch" style="background-color: #ddd6ce;"></span>
                </div>
            </div>

            <div class="mufti-product">
                <div class="product-image">
                    <img src="images/kurtis/kurti4.jpg" alt="Cotton Kurti">
                    <div class="hover-icons">
                        <i class="far fa-heart" aria-label="Add to Wishlist"></i>
                        <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
                    </div>
                </div>
                <p class="product-title">Cotton Kurti</p>
                <div class="price-section">
                    <span class="discounted-price">₹1,000</span>
                    <span class="original-price">₹1,300</span>
                    <span class="discount-tag">23% OFF</span>
                </div>
                <div class="color-swatches">
                    <span class="color-swatch" style="background-color: #ccc;"></span>
                    <span class="color-swatch" style="background-color: #f2e1dc;"></span>
                </div>
            </div>

            <div class="mufti-product">
                <div class="product-image">
                    <img src="images/kurtis/kurti5.jpg" alt="Cotton Kurti">
                    <div class="hover-icons">
                        <i class="far fa-heart" aria-label="Add to Wishlist"></i>
                        <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
                    </div>
                </div>
                <p class="product-title">Cotton Kurti</p>
                <div class="price-section">
                    <span class="discounted-price">₹1,000</span>
                    <span class="original-price">₹1,300</span>
                    <span class="discount-tag">23% OFF</span>
                </div>
                <div class="color-swatches">
                    <span class="color-swatch" style="background-color: #fceee3;"></span>
                    <span class="color-swatch" style="background-color: #d9c8c2;"></span>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
   <script src="script.js"></script>
   <script src="footer.js"></script>
   <script src="navbar.js"></script>
   <script src="cart.js"></script>
   <script src="sizeSelector.js"></script>
</body>
</html>
