<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurtis Collection - Trendy Wear</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div id="navbar-container"></div>
    </header>

    <section id="products">
        <h2>Women's Kurtis</h2>
        <div class="product-container">
            <div class="product" data-id="1" data-name="Floral Kurti" data-price="1200">
                <img src="images/kurtis/kurti1.jpg" alt="Floral Kurti">
                <p>Floral Kurti - ₹1200</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(1)">-</button>
                    <span id="qty-1">0</span>
                    <button onclick="addToCart(1, 'Floral Kurti', 1200)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(1, 'Floral Kurti', 1200)">Add to Cart</button>
            </div>
            <div class="product" data-id="2" data-name="Embroidered Kurti" data-price="1400">
                <img src="images/kurtis/kurti2.jpg" alt="Embroidered Kurti">
                <p>Embroidered Kurti - ₹1400</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(2)">-</button>
                    <span id="qty-2">0</span>
                    <button onclick="addToCart(2, 'Embroidered Kurti', 1400)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(2, 'Embroidered Kurti', 1400)">Add to Cart</button>
            </div>
            <div class="product" data-id="3" data-name="Cotton Kurti" data-price="1000">
                <img src="images/kurtis/kurti3.jpg" alt="Cotton Kurti">
                <p>Cotton Kurti - ₹1000</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(3)">-</button>
                    <span id="qty-3">0</span>
                    <button onclick="addToCart(3, 'Cotton Kurti', 1000)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(3, 'Cotton Kurti', 1000)">Add to Cart</button>
            </div>
            <div class="product" data-id="4" data-name="Cotton Kurti" data-price="1000">
                <img src="images/kurtis/kurti4.jpg" alt="Cotton Kurti">
                <p>Cotton Kurti - ₹1000</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(4)">-</button>
                    <span id="qty-4">0</span>
                    <button onclick="addToCart(4, 'Cotton Kurti', 1000)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(4, 'Cotton Kurti', 1000)">Add to Cart</button>
            </div>
            <div class="product" data-id="5" data-name="Cotton Kurti" data-price="1000">
                <img src="images/kurtis/kurti5.jpg" alt="Cotton Kurti">
                <p>Cotton Kurti - ₹1000</p>
                <div class="qty-buttons">
                    <button onclick="removeFromCart(5)">-</button>
                    <span id="qty-5">0</span>
                    <button onclick="addToCart(5, 'Cotton Kurti', 1000)">+</button>
                </div>
                <button class="add-cart-btn" onclick="addToCart(5, 'Cotton Kurti', 1000)">Add to Cart</button>
            </div>
        </div>
    </section>

    <section id="cart">
        <h2>Shopping Cart</h2>
        <div id="cart-items"></div>
        <p>Total: ₹<span id="cart-total">0</span></p>
        <button onclick="checkout()">Checkout</button>
    </section>

    <div id="footer-container"></div>
    <script src="script.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>

</body>
</html>
