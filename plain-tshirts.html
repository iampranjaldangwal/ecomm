<!DOCTYPE html>

            <div class="mufti-product">
                <div class="product-image">
                    <img src="images/plainTee/plainTee1.jpg" alt="Graphic Print Tee">

                    </div>

                    <span class="original-price">₹1,200</span>

                </div>
                <div class="color-swatches">

            </div>
