<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar d-none d-md-block">
    <h4 class="text-center py-3 border-bottom">Admin</h4>
    <a href="#">Dashboard</a>
    <a href="#">Add Product</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>

  <!-- Content -->
  <div class="content container">
    <div class="d-md-none text-end mb-3">
      <button class="btn btn-dark" onclick="toggleSidebar()">☰</button>
    </div>

    <h2>Admin Dashboard</h2>

    <!-- Add Product -->
    <form id="addProductForm" class="card p-4 mb-4 shadow">
      <h4>Add Product</h4>
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Product Name" id="productName" required>
        </div>
        <div class="col-md-6">
          <select class="form-select" id="productCategory" required>
            <option value="">Select Category</option>
            <option>Shirts</option>
            <option>Jeans</option>
            <option>Jackets</option>
          </select>
        </div>
        <div class="col-md-6">
          <select class="form-select" id="productSizes" required>
            <option value="">Select Size</option>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>
        <div class="col-md-6">
          <input type="number" class="form-control" placeholder="Stock" id="productStock" required>
        </div>
        <div class="col-md-6">
          <input type="number" class="form-control" placeholder="Price" id="productPrice" required>
        </div>
        <div class="col-md-6">
          <input type="file" class="form-control" id="productImage" accept="image/*" required>
        </div>
        <div class="col-12">
          <button class="btn btn-dark w-100">Add Product</button>
        </div>
      </div>
    </form>

    <!-- Search -->
    <input type="text" class="form-control mb-3" placeholder="Search Products..." id="searchInput">

    <!-- Product List -->
    <div id="productList"></div>

    <!-- Pagination -->
    <nav>
      <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
