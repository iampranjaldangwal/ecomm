<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Collection</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="men.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"> 
</head>
<body>
    <header>
        <div id="navbar-container"></div>
    </header>

    <section>
        <h2>Plain T-Shirts</h2>
        <div id="plainTeeCarousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <a href="plain-tshirts.html">
                        <img src="images/plainTee/plainTee1.jpg" class="d-block w-100" alt="Plain Tee 1">
                    </a>
                </div>
                <div class="carousel-item">
                    <a href="plain-tshirts.html">
                        <img src="images/plainTee/plainTee2.jpg" class="d-block w-100" alt="Plain Tee 2">
                    </a>
                </div>
                <div class="carousel-item">
                    <a href="plain-tshirts.html">
                        <img src="images/plainTee/plainTee3.jpg" class="d-block w-100" alt="Plain Tee 3">
                    </a>
                </div>
            </div>
            <a class="carousel-control-prev" href="#plainTeeCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </a>
            <a class="carousel-control-next" href="#plainTeeCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </a>
        </div>
    </section>

    <section>
        <h2>Printed T-Shirts</h2>
        <div id="printedTeeCarousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <a href="printed-tshirts.html">
                        <img src="images/printedTee/printedCarousel1.png" class="d-block w-100" alt="Printed Tee 1">
                    </a>
                </div>
                <div class="carousel-item">
                    <a href="printed-tshirts.html">
                        <img src="images/printedTee/printedCarousel2.jpg" class="d-block w-100" alt="Printed Tee 2">
                    </a>
                </div>
                <div class="carousel-item">
                    <a href="printed-tshirts.html">
                        <img src="images/printedTee/printed3.jpg" class="d-block w-100" alt="Printed Tee 3">
                    </a>
                </div>
            </div>
            <a class="carousel-control-prev" href="#printedTeeCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </a>
            <a class="carousel-control-next" href="#printedTeeCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </a>
        </div>
    </section>

    <div id="footer-container"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
   
    <script src="script.js"></script>
    <script src="footer.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
