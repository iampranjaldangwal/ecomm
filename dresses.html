<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dresses Collection - Trendy Wear</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
  <header>
    <div id="navbar-container"></div>
  </header>

  <section id="products">
    <h2>Women's Dresses</h2>
    <div class="product-container">

      <div class="mufti-product">
        <div class="product-image">
          <img src="images/dresses/dress1.jpg" alt="Elegant Evening Dress" />
          <div class="hover-icons">
            <i class="far fa-heart" aria-label="Add to Wishlist"></i>
            <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
          </div>
        </div>
        <p class="product-title">Elegant Evening Dress</p>
        <div class="price-section">
          <span class="discounted-price">₹1,500</span>
          <span class="original-price">₹2,000</span>
          <span class="discount-tag">25% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #e6d9ec;"></span>
          <span class="color-swatch" style="background-color: #d3bccc;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <div class="product-image">
          <img src="images/dresses/dress2.jpg" alt="Floral Summer Dress" />
          <div class="hover-icons">
            <i class="far fa-heart" aria-label="Add to Wishlist"></i>
            <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
          </div>
        </div>
        <p class="product-title">Floral Summer Dress</p>
        <div class="price-section">
          <span class="discounted-price">₹1,200</span>
          <span class="original-price">₹1,500</span>
          <span class="discount-tag">20% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #fff1e6;"></span>
          <span class="color-swatch" style="background-color: #f9d5d3;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <div class="product-image">
          <img src="images/dresses/dress3.jpg" alt="Casual Midi Dress" />
          <div class="hover-icons">
            <i class="far fa-heart" aria-label="Add to Wishlist"></i>
            <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
          </div>
        </div>
        <p class="product-title">Casual Midi Dress</p>
        <div class="price-section">
          <span class="discounted-price">₹1,300</span>
          <span class="original-price">₹1,700</span>
          <span class="discount-tag">24% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #e5e5e5;"></span>
          <span class="color-swatch" style="background-color: #fdf0f0;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <div class="product-image">
          <img src="images/dresses/dress4.jpg" alt="Wrap Dress" />
          <div class="hover-icons">
            <i class="far fa-heart" aria-label="Add to Wishlist"></i>
            <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
          </div>
        </div>
        <p class="product-title">Wrap Dress</p>
        <div class="price-section">
          <span class="discounted-price">₹1,400</span>
          <span class="original-price">₹1,800</span>
          <span class="discount-tag">22% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #f8e1e7;"></span>
          <span class="color-swatch" style="background-color: #cdb4c2;"></span>
        </div>
      </div>

      <div class="mufti-product">
        <div class="product-image">
          <img src="images/dresses/dress5.jpg" alt="Boho Maxi Dress" />
          <div class="hover-icons">
            <i class="far fa-heart" aria-label="Add to Wishlist"></i>
            <i class="fas fa-shopping-bag" aria-label="Add to Cart"></i>
          </div>
        </div>
        <p class="product-title">Boho Maxi Dress</p>
        <div class="price-section">
          <span class="discounted-price">₹1,300</span>
          <span class="original-price">₹1,600</span>
          <span class="discount-tag">19% OFF</span>
        </div>
        <div class="color-swatches">
          <span class="color-swatch" style="background-color: #fff7ea;"></span>
          <span class="color-swatch" style="background-color: #d0cbc4;"></span>
        </div>
      </div>

    </div>
  </section>

  <div id="footer-container"></div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
 <script src="script.js"></script>
 <script src="footer.js"></script>
 <script src="navbar.js"></script>
 <script src="cart.js"></script>
 <script src="sizeSelector.js"></script>
</body>
</html>
